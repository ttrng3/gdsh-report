# Publishes only what .pages-allow lists, and checks that everything the
# routine writes is accounted for.
#
# .pages-allow line types:
#   path or glob     published (a glob never crosses a / and must match a file)
#   !path or !glob   known, deliberately NOT published
#   @prefix/         a watched area: every changed file under it must match a
#                    published or ! line, or the run fails "UNCOVERED"
#
# Dry run: unless the Pages setting reads build_type == workflow, nothing is
# deployed. A failed read never deploys either, and it turns the run RED
# (couldn't tell), while a read of 'legacy' is a green dry run.
# Fails closed: a missing path, an empty glob or an escaping path stops the
# deploy, and the live site stays as it was.
name: Pages (allowlist)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # publish.yml pushes with GITHUB_TOKEN and [skip ci], which triggers no push
  # workflow, so its finished runs trigger this one directly.
  workflow_run:
    workflows: ["GDSH monthly publish"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      uncovered: ${{ steps.coverage.outputs.uncovered }}
      readfail: ${{ steps.mode.outputs.readfail }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 50

      - name: Mode (live only when Pages is set to GitHub Actions)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if resp="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pages" 2>/dev/null)" \
             && bt="$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build_type"])' 2>/dev/null)" \
             && [ -n "$bt" ]; then
            echo "readfail=no" >> "$GITHUB_OUTPUT"
          else
            bt=""; echo "readfail=yes" >> "$GITHUB_OUTPUT"
          fi
          if [ "$bt" = "workflow" ]; then echo "mode=live" >> "$GITHUB_OUTPUT"; echo "Mode: LIVE (build_type=workflow)"
          elif [ -z "$bt" ]; then echo "mode=dry" >> "$GITHUB_OUTPUT"; echo "::error::Pages setting UNREADABLE: not deploying, and this run will be red (couldn't tell, so didn't try)"
          else echo "mode=dry" >> "$GITHUB_OUTPUT"; echo "Mode: DRY RUN (build_type=$bt), nothing will be deployed"; fi

      - name: Stage allowlisted files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          shopt -u dotglob
          shopt -u globstar 2>/dev/null || true
          rm -rf _site && mkdir _site
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            path="${line%%#*}"; path="$(echo "$path" | xargs)"
            [ -z "$path" ] && continue
            case "$path" in !*|@*) continue;; esac
            case "$path" in /*|*..*) echo "::error::refusing path outside the repo: $path"; exit 1;; esac
            if [[ "$path" == *"*"* ]]; then
              matches=( $path )
              [ "${#matches[@]}" -gt 0 ] || { echo "::error::glob in .pages-allow matches nothing: $path"; exit 1; }
            else
              matches=( "$path" )
            fi
            for f in "${matches[@]}"; do
              [ -f "$f" ] || { echo "::error::listed in .pages-allow but missing: $f"; exit 1; }
              cp --parents "$f" _site/
              n=$((n+1))
            done
          done < .pages-allow
          [ "$n" -gt 0 ] || { echo "::error::.pages-allow lists nothing"; exit 1; }
          echo "Staged $n file(s):"; find _site -type f | sort

      - name: Coverage (every changed file in a watched area is listed)
        id: coverage
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$EVENT" = "workflow_run" ] && [ -n "$RUN_SHA" ] && git cat-file -e "$RUN_SHA" 2>/dev/null; then
            base="$RUN_SHA"
          else
            base="HEAD~1"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed.txt || true
          echo "Changed since $base:"; sed 's/^/  /' /tmp/changed.txt
          python3 - <<'PY'
          import fnmatch, sys
          pub, known, watch = [], [], []
          for raw in open(".pages-allow"):
              s = raw.split("#", 1)[0].strip()
              if not s: continue
              if s.startswith("@"): watch.append(s[1:])
              elif s.startswith("!"): known.append(s[1:])
              else: pub.append(s)
          def match(f, pat):  # * never crosses a /
              a, b = f.split("/"), pat.split("/")
              return len(a) == len(b) and all(fnmatch.fnmatchcase(x, y) for x, y in zip(a, b))
          changed = [l.strip() for l in open("/tmp/changed.txt") if l.strip()]
          bad = [f for f in changed
                 if any(f.startswith(w) for w in watch)
                 and not any(match(f, p) for p in pub + known)]
          open("/tmp/uncovered.txt", "w").write("\n".join(bad))
          for f in bad: print(f"::error::UNCOVERED: {f} (in a watched area, but on no .pages-allow line)")
          print(f"Coverage: {len(changed)} changed, {len(bad)} uncovered, watched: {watch or 'none'}")
          PY
          if [ -s /tmp/uncovered.txt ]; then echo "uncovered=yes" >> "$GITHUB_OUTPUT"; else echo "uncovered=no" >> "$GITHUB_OUTPUT"; fi

      - if: steps.mode.outputs.mode == 'live'
        uses: actions/configure-pages@v6

      - if: steps.mode.outputs.mode == 'live'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site


  deploy:
    needs: build
    if: needs.build.outputs.mode == 'live'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verdict:
    needs: [build, deploy]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Result
        shell: bash
        run: |
          echo "build: ${{ needs.build.result }} | mode: ${{ needs.build.outputs.mode }} | deploy: ${{ needs.deploy.result }} | uncovered: ${{ needs.build.outputs.uncovered }} | pages-read-failed: ${{ needs.build.outputs.readfail }}"
          [ "${{ needs.build.result }}" = "success" ] || { echo "::error::build failed (allowlist or staging)"; exit 1; }
          [ "${{ needs.build.outputs.readfail }}" = "yes" ] && { echo "::error::Pages setting was unreadable, so nothing was deployed. Red means couldn't tell; check the Pages settings and the workflow token."; exit 1; }
          if [ "${{ needs.build.outputs.mode }}" = "live" ] && [ "${{ needs.deploy.result }}" != "success" ]; then echo "::error::live mode but deploy did not succeed"; exit 1; fi
          if [ "${{ needs.build.outputs.uncovered }}" = "yes" ]; then
            echo "::error::A routine wrote a file the allowlist doesn't account for. Add it to .pages-allow (published) or as a ! line (not published)."
            exit 1
          fi
          echo "OK"
