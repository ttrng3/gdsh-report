# Publishes only what .pages-allow lists, and checks that every tracked file
# in a watched area is accounted for.
#
# .pages-allow line types:
#   path or glob     published (a glob never crosses a / and must match a file)
#   !path or !glob   known, deliberately NOT published
#   @prefix/         a watched area: every tracked file under it must match a
#                    published or ! line, or the run fails "UNCOVERED"
#                    (the whole tree is checked every run, not just the diff)
# A * never matches a leading dot, on published and ! lines alike (bash staging
# runs with dotglob off): list a dotfile explicitly, e.g. !data/.last-check.
#
# Dry run: unless the Pages setting reads build_type == workflow, nothing is
# deployed. A failed read never deploys either, and it turns the run RED
# (couldn't tell), while a read of 'legacy' is a green dry run.
# Fails closed, and the live site stays as it was, on any of:
#   - a missing path, or a glob that matches nothing
#   - a path that escapes the repo, or a symlink anywhere in a listed path
#   - a backslash on any line
#   - a [ ] form other than a simple set ([abc], [!x], [^x]; no set inside a
#     set, no / inside a set)
#   - any wildcard on an @ line (a watched area is a plain path)
#   - an allowlist that lists nothing to publish
# In a simple set, [^x] and [!x] both mean "not x" in both steps.
name: Pages (allowlist)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # publish.yml pushes with GITHUB_TOKEN and [skip ci], which triggers no push
  # workflow, so its finished runs trigger this one directly.
  workflow_run:
    workflows: ["GDSH monthly publish"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      uncovered: ${{ steps.coverage.outputs.uncovered }}
      readfail: ${{ steps.mode.outputs.readfail }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Mode (live only when Pages is set to GitHub Actions)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if resp="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pages" 2>/dev/null)" \
             && bt="$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build_type"])' 2>/dev/null)" \
             && [ -n "$bt" ]; then
            echo "readfail=no" >> "$GITHUB_OUTPUT"
          else
            bt=""; echo "readfail=yes" >> "$GITHUB_OUTPUT"
          fi
          if [ "$bt" = "workflow" ]; then echo "mode=live" >> "$GITHUB_OUTPUT"; echo "Mode: LIVE (build_type=workflow)"
          elif [ -z "$bt" ]; then echo "mode=dry" >> "$GITHUB_OUTPUT"; echo "::error::Pages setting UNREADABLE: not deploying, and this run will be red (couldn't tell, so didn't try)"
          else echo "mode=dry" >> "$GITHUB_OUTPUT"; echo "Mode: DRY RUN (build_type=$bt), nothing will be deployed"; fi

      - name: Stage allowlisted files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          shopt -u dotglob
          shopt -u globstar 2>/dev/null || true
          rm -rf _site && mkdir _site
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            path="${line%%#*}"
            path="${path#"${path%%[![:space:]]*}"}"; path="${path%"${path##*[![:space:]]}"}"
            [ -z "$path" ] && continue
            case "$path" in *\\*) echo "::error::refusing a backslash in .pages-allow (bash and the coverage check read escapes differently; use a ? or * glob instead): $path"; exit 1;; esac
            # one pass, never repeated, so removing a set can't join its neighbours into a new one;
            # a leading ! or ^ is always negation and needs at least one member; a / is never a member;
            # # is the delimiter because comments are already stripped, so no # reaches this line
            rest="$(printf '%s' "$path" | sed -E 's#\[([!^][^][/]+|[^][!^/][^][/]*)\]##g')"
            case "$rest" in *[][]*) echo "::error::refusing a [ ] form other than a simple set like [abc], [!x] or [^x] (no set inside a set, no / inside a set; the coverage check reads other forms differently): $path"; exit 1;; esac
            case "$path" in @*[\*\?\[]*) echo "::error::refusing a wildcard on an @ line (a watched area is a plain path, not a glob): $path"; exit 1;; esac
            case "$path" in !*|@*) continue;; esac
            case "$path" in /*|*..*) echo "::error::refusing path outside the repo: $path"; exit 1;; esac
            if [[ "$path" == *[\*\?\[]* ]]; then
              IFS= ; matches=( $path ); unset IFS   # glob, but never split a line on spaces
              [ "${#matches[@]}" -gt 0 ] || { echo "::error::glob in .pages-allow matches nothing: $path"; exit 1; }
            else
              matches=( "$path" )
            fi
            for f in "${matches[@]}"; do
              [ -L "$f" ] && { echo "::error::refusing a symlink in .pages-allow: $f"; exit 1; }
              [ -f "$f" ] || { echo "::error::listed in .pages-allow but missing: $f"; exit 1; }
              real="$(realpath -e -- "$f")"; root="$(pwd -P)"
              case "$real" in "$root"/*) ;; *) echo "::error::refusing a path that resolves outside the repo (a symlinked directory?): $f"; exit 1;; esac
              [ "$real" = "$root/$f" ] || { echo "::error::refusing a path that goes through a symlink (or is not written plainly): $f"; exit 1; }
              cp --parents "$f" _site/
              n=$((n+1))
            done
          done < .pages-allow
          [ "$n" -gt 0 ] || { echo "::error::.pages-allow lists nothing"; exit 1; }
          echo "Staged $n file(s):"; find _site -type f | sort

      - name: Coverage (every tracked file in a watched area is listed)
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -s -z > /tmp/tracked.bin
          python3 - <<'PY'
          import fnmatch
          pub, known, watch = [], [], []
          for raw in open(".pages-allow"):
              s = raw.split("#", 1)[0].strip()
              if not s: continue
              if s.startswith("@"): watch.append(s[1:].rstrip("/"))   # a file, or a directory and everything under it
              elif s.startswith("!"): known.append(s[1:])
              else: pub.append(s)
          def seg(name, pat):  # bash staging runs with dotglob off: * never matches a leading dot
              if name.startswith(".") and not pat.startswith("."): return False
              pat = pat.replace("[^", "[!")   # Stage allows only simple sets, so every [^ opens one
              return fnmatch.fnmatchcase(name, pat)
          def match(f, pat):   # * never crosses a /
              a, b = f.split("/"), pat.split("/")
              return len(a) == len(b) and all(seg(x, y) for x, y in zip(a, b))
          tracked = []
          for rec in open("/tmp/tracked.bin", "rb").read().split(b"\0"):
              if not rec: continue
              meta, path = rec.decode("utf-8", "surrogateescape").split("\t", 1)   # -z: no C-quoting
              tracked.append((path, meta.split()[0] == "120000"))   # 120000 = symlink
          def watched(f):  # "@data" watches data and data/..., never database/...; a bare "@" watches everything
              return any(w == "" or f == w or f.startswith(w + "/") for w in watch)
          bad = []
          for f, is_link in tracked:
              if not watched(f): continue
              if is_link: bad.append((f, "a symlink: never allowed in a watched area, even on a ! line"))
              elif not any(match(f, p) for p in pub + known): bad.append((f, "in a watched area, but on no .pages-allow line"))
          open("/tmp/uncovered.txt", "w").write("\n".join(f for f, _ in bad))
          for f, why in bad: print(f"::error::UNCOVERED: {f} ({why})")
          n = sum(1 for f, _ in tracked if watched(f))
          print(f"Coverage: {n} tracked in watched areas, {len(bad)} uncovered, watched: {watch or 'none'}")
          PY
          if [ -s /tmp/uncovered.txt ]; then echo "uncovered=yes" >> "$GITHUB_OUTPUT"; else echo "uncovered=no" >> "$GITHUB_OUTPUT"; fi

      - if: steps.mode.outputs.mode == 'live'
        uses: actions/configure-pages@v6

      - if: steps.mode.outputs.mode == 'live'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site


  deploy:
    needs: build
    if: needs.build.outputs.mode == 'live'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verdict:
    needs: [build, deploy]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Result
        shell: bash
        run: |
          echo "build: ${{ needs.build.result }} | mode: ${{ needs.build.outputs.mode }} | deploy: ${{ needs.deploy.result }} | uncovered: ${{ needs.build.outputs.uncovered }} | pages-read-failed: ${{ needs.build.outputs.readfail }}"
          [ "${{ needs.build.result }}" = "success" ] || { echo "::error::build failed (allowlist or staging)"; exit 1; }
          [ "${{ needs.build.outputs.readfail }}" = "yes" ] && { echo "::error::Pages setting was unreadable, so nothing was deployed. Red means couldn't tell; check the Pages settings and the workflow token."; exit 1; }
          if [ "${{ needs.build.outputs.mode }}" = "live" ] && [ "${{ needs.deploy.result }}" != "success" ]; then echo "::error::live mode but deploy did not succeed"; exit 1; fi
          if [ "${{ needs.build.outputs.uncovered }}" = "yes" ]; then
            echo "::error::A tracked file in a watched area is on no .pages-allow line, or is a symlink. Add a missing file to .pages-allow (published) or as a ! line (not published), in its own PR; replace a symlink with a regular file."
            exit 1
          fi
          echo "OK"
