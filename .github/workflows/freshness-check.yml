name: Data freshness check

# The dashboard's failure mode has never been a crash — it is silence. The
# weekly refresh simply stops running and the page keeps serving old numbers
# with a confident face. This job opens a GitHub issue when data/index.json
# stops being updated, so a missed refresh is visible instead of invisible.
on:
  schedule:
    - cron: "0 4 * * *"   # 11:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  MAX_RUN_AGE_DAYS: 10
  MAX_DATA_AGE_DAYS: 45

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Measure data age
        id: age
        run: python3 .github/scripts/freshness.py >> "$GITHUB_OUTPUT"

      - name: Open issue if stale
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="gdsh-report: ${{ steps.age.outputs.why }}"
          existing=$(gh issue list --state open --label stale-data --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "\`data/index.json\` was last generated **${{ steps.age.outputs.generated }}** (${{ steps.age.outputs.days }} days ago)." \
            "Latest week published: **${{ steps.age.outputs.week }}**." \
            "" \
            "The weekly refresh has not run. Check the scheduled routine, then re-run it." \
            "Thresholds: run ${MAX_RUN_AGE_DAYS}d, data ${MAX_DATA_AGE_DAYS}d.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create stale-data --color B60205 --description "Dashboard data stopped refreshing" 2>/dev/null || true
            gh issue create --title "$title" --label stale-data --body "$body"
          fi

      - name: Close issue if fresh again
        if: steps.age.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label stale-data --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Data is fresh again (${{ steps.age.outputs.generated }}, latest week ${{ steps.age.outputs.week }})."
          done
